[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inmydata-openedge"
version = "0.0.1"
authors = [
  { name = "inmydata", email = "info@inmydata.com" },
]
description = "This package provides simple API data access to PAS and Classic AppServers via the inmydata platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
  "aiohttp >= 3.11.18",
  "jsonpickle >= 4.0.5",
  "pandas >= 2.3.0",
  "requests >= 2.32.4"
]

[project.urls]
Homepage = "https://inmydata.ai"
Documentation = "https://developer.inmydata.com"
Reference = "https://docs.inmydata.ai/openedge-agents/"
Issues = "https://support.inmydata.com"
Source = "https://github.com/inmydata/openedge-agents"
Examples = "https://github.com/inmydata/agent-examples"

